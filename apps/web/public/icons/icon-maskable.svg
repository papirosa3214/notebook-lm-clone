<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: critical content stays inside the 80% safe zone
       (центрированный квадрат 410×410). Outer 51px bleed is masked
       away on platforms that support adaptive icons. -->
  <rect width="512" height="512" fill="#D97757"/>
  <g transform="translate(51, 51)">
    <rect x="0" y="32" width="410" height="320" rx="32" fill="#FFFFFF"/>
    <line x1="80" y1="120" x2="330" y2="120" stroke="#E0D8C8" stroke-width="14" stroke-linecap="round"/>
    <line x1="80" y1="180" x2="300" y2="180" stroke="#E0D8C8" stroke-width="14" stroke-linecap="round"/>
    <line x1="80" y1="240" x2="330" y2="240" stroke="#E0D8C8" stroke-width="14" stroke-linecap="round"/>
    <circle cx="330" cy="80" r="22" fill="#F5D69A"/>
  </g>
</svg>
